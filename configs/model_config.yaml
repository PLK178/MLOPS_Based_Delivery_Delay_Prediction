# Model training configuration

# Dataset configuration
data:
  path: "Data/processed/cleaned_dataset.csv"
  target: "is_delayed"
  task_type: "classification" # options: classification, regression
  drop_columns:
    - "order_id"
    - "product_id"
    - "seller_id"
    - "delivery_time_days" # Drop to prevent leakage if predicting delay
  categorical_features:
    - "product_category_name"

# Cross-validation configuration
cv:
  n_splits: 5
  shuffle: true
  random_state: 42

# Model hyperparameters with class weighting
models:
  logistic_regression:
    params:
      max_iter: 1000
      random_state: 42
      C: 1.0
      class_weight: "balanced"
  
  decision_tree:
    params:
      max_depth: 10
      min_samples_split: 10
      random_state: 42
      class_weight: "balanced"

  random_forest:
    params:
      n_estimators: 100
      max_depth: 10
      random_state: 42
      n_jobs: -1
      class_weight: "balanced"

  extra_trees:
    params:
      n_estimators: 100
      max_depth: 10
      random_state: 42
      n_jobs: -1
      class_weight: "balanced"

  adaboost:
    params:
      n_estimators: 100
      learning_rate: 0.1
      random_state: 42

  gradient_boosting:
    params:
      n_estimators: 100
      learning_rate: 0.05
      max_depth: 6
      random_state: 42

  xgboost:
    params:
      n_estimators: 500
      learning_rate: 0.05
      max_depth: 6
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      tree_method: "hist"
      eval_metric: "logloss"
      early_stopping_rounds: 50
      scale_pos_weight: 11.5
  
  catboost:
    params:
      iterations: 500
      learning_rate: 0.05
      depth: 6
      random_seed: 42
      verbose: 100
      early_stopping_rounds: 50
      auto_class_weights: "Balanced"
  
  lightgbm:
    params:
      n_estimators: 500
      learning_rate: 0.05
      max_depth: 6
      num_leaves: 31
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      verbose: -1
      early_stopping_rounds: 50
      is_unbalance: true
