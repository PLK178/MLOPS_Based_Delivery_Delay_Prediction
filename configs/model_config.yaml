# Model training configuration

# Dataset configuration
data:
  path: "Data/processed/cleaned_dataset.csv"
  target: "delivery_time_days"
  task_type: "regression" # options: classification, regression
  drop_columns:
    - "order_id"
    - "product_id"
    - "seller_id"
    - "is_delayed" # Drop to prevent leakage if predicting delivery time
  categorical_features:
    - "product_category_name"

# Cross-validation configuration
cv:
  n_splits: 5
  shuffle: true
  random_state: 42




# Model hyperparameters for regression
models:
  logistic_regression:
    static_params:
      random_state: 42
    param_grid:
      alpha: [0.1, 1.0, 10.0]
  
  decision_tree:
    static_params:
      random_state: 42
    param_grid:
      max_depth: [5, 10, 15]
      min_samples_split: [5, 10, 20]

  random_forest:
    static_params:
      random_state: 42
      n_jobs: -1
    param_grid:
      n_estimators: [50, 100]
      max_depth: [8, 12]

  extra_trees:
    static_params:
      random_state: 42
      n_jobs: -1
    param_grid:
      n_estimators: [50, 100]
      max_depth: [8, 12]

  adaboost:
    static_params:
      random_state: 42
    param_grid:
      n_estimators: [50, 100]
      learning_rate: [0.05, 0.1]

  gradient_boosting:
    static_params:
      random_state: 42
    param_grid:
      n_estimators: [50, 100]
      learning_rate: [0.05, 0.1]
      max_depth: [4, 6]

  xgboost:
    static_params:
      random_state: 42
      tree_method: "hist"
      eval_metric: "rmse"
      early_stopping_rounds: 50
    param_grid:
      n_estimators: [100, 300]
      learning_rate: [0.05, 0.1]
      max_depth: [4, 6]
  
  catboost:
    static_params:
      random_seed: 42
      verbose: 0
      early_stopping_rounds: 50
    param_grid:
      iterations: [100, 300]
      learning_rate: [0.05, 0.1]
      depth: [4, 6]
  
  lightgbm:
    static_params:
      random_state: 42
      verbose: -1
      early_stopping_rounds: 50
    param_grid:
      n_estimators: [100, 300]
      learning_rate: [0.05, 0.1]
      max_depth: [4, 6]

