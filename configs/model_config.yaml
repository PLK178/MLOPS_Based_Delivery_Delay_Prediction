# Model training configuration

# Dataset configuration
data:
  path: "Data/processed/cleaned_dataset.csv"
  target: "is_delayed"
  task_type: "classification" # options: classification, regression
  drop_columns:
    - "order_id"
    - "product_id"
    - "seller_id"
    - "delivery_time_days" # Drop to prevent leakage if predicting delay
  categorical_features:
    - "product_category_name"

# Cross-validation configuration
cv:
  n_splits: 5
  shuffle: true
  random_state: 42




# Model hyperparameters with class weighting
models:
  logistic_regression:
    static_params:
      max_iter: 1000
      random_state: 42
      class_weight: "balanced"
    param_grid:
      C: [0.1, 1.0, 10.0]
  
  decision_tree:
    static_params:
      random_state: 42
      class_weight: "balanced"
    param_grid:
      max_depth: [5, 10, 15]
      min_samples_split: [5, 10, 20]

  random_forest:
    static_params:
      random_state: 42
      n_jobs: -1
      class_weight: "balanced"
    param_grid:
      n_estimators: [50, 100]
      max_depth: [8, 12]

  extra_trees:
    static_params:
      random_state: 42
      n_jobs: -1
      class_weight: "balanced"
    param_grid:
      n_estimators: [50, 100]
      max_depth: [8, 12]

  adaboost:
    static_params:
      random_state: 42
    param_grid:
      n_estimators: [50, 100]
      learning_rate: [0.05, 0.1]

  gradient_boosting:
    static_params:
      random_state: 42
    param_grid:
      n_estimators: [50, 100]
      learning_rate: [0.05, 0.1]
      max_depth: [4, 6]

  xgboost:
    static_params:
      random_state: 42
      tree_method: "hist"
      eval_metric: "logloss"
      early_stopping_rounds: 50
      scale_pos_weight: 11.5
    param_grid:
      n_estimators: [100, 300]
      learning_rate: [0.05, 0.1]
      max_depth: [4, 6]
  
  catboost:
    static_params:
      random_seed: 42
      verbose: 0
      early_stopping_rounds: 50
      auto_class_weights: "Balanced"
    param_grid:
      iterations: [100, 300]
      learning_rate: [0.05, 0.1]
      depth: [4, 6]
  
  lightgbm:
    static_params:
      random_state: 42
      verbose: -1
      early_stopping_rounds: 50
      is_unbalance: true
    param_grid:
      n_estimators: [100, 300]
      learning_rate: [0.05, 0.1]
      max_depth: [4, 6]
